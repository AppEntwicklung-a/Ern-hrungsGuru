den Makron\xE4hrstoffen: 1 g Fett liefert ~9 kcal, 1 g Kohlenhydrate oder Eiwei\xDF je ~4 kcal, 1 g Alkohol ~7 kcal.",warum:"Der K\xF6rper braucht Energie f\xFCr alles \u2013 vom Atmen \xFCber Bewegung bis zur Verdauung. Nimmst du dauerhaft mehr auf, als du verbrauchst, speichert der K\xF6rper den \xDCberschuss; nimmst du weniger auf, greift er Reserven an. Entscheidend ist die Bilanz \xFCber die Zeit, nicht die einzelne Mahlzeit.",quellen:"Alle energieliefernden Lebensmittel; besonders energiedicht sind Fette/\xD6le sowie stark verarbeitete, zuckerreiche Produkte.",bedarf:"Stark individuell. Grobe Orientierung: Frauen ~1.800\u20132.200 kcal, M\xE4nner ~2.200\u20132.700 kcal pro Tag \u2013 je nach Alter, Gewicht und Aktivit\xE4t. Deinen pers\xF6nlichen Bedarf kannst du sp\xE4ter im Bodyrechner ermitteln.",link:null,pro:"Versorgt den K\xF6rper mit der Energie, die er f\xFCr alle Funktionen ben\xF6tigt \u2013 von der Zellteilung bis zur Muskelarbeit.",con:"Dauerhafter \xDCberschuss f\xFChrt zur Fettspeicherung. Leere Kalorien (Zucker, Alkohol) liefern Energie ohne N\xE4hrstoffe."},{id:2,term:"Protein / Eiwei\xDF",cat:"makro",short:"Baustoff des K\xF6rpers \u2013 f\xFCr Muskeln, Enzyme, Hormone und Immunsystem.",was:"Proteine bestehen aus Aminos\xE4uren. Neun davon sind essenziell, d. h. der K\xF6rper kann sie nicht selbst herstellen und muss sie \xFCber die Nahrung aufnehmen. Tierische Quellen liefern meist alle essenziellen Aminos\xE4uren, pflanzliche erg\xE4nzen sich gut in Kombination (z. B. H\xFClsenfr\xFCchte + Getreide).",warum:"Eiwei\xDF ist der wichtigste Baustoff f\xFCr Muskeln, Haut, Haare, Enzyme und Abwehrzellen. Es s\xE4ttigt stark und hilft beim Muskelerhalt \u2013 gerade beim Abnehmen. Proteinreiche Lebensmittel sind in der App mit dem Tag \u201EProteinreich\u201C markiert.",quellen:"Fleisch, Fisch, Eier, Milchprodukte (Quark, Skyr, K\xE4se), H\xFClsenfr\xFCchte, Tofu, N\xFCsse und Kerne.",bedarf:"DGE-Orientierung: ~0,8 g pro kg K\xF6rpergewicht, also ca. 55\u201370 g/Tag f\xFCr Erwachsene. Bei viel Sport oder Muskelaufbau eher 1,2\u20132,0 g/kg.",link:{tag:"Proteinreich"},pro:"St\xE4rkstes S\xE4ttigungsgef\xFChl aller Makron\xE4hrstoffe. Erh\xE4lt Muskelmasse beim Abnehmen. Unverzichtbar f\xFCr Immunsystem, Haut und Enzyme.",con:"Sehr hohe Mengen \xFCber lange Zeit k\xF6nnen Nieren belasten (besonders bei vorerkrankten Personen). Tierische Quellen oft mit ges\xE4ttigten Fetten verbunden."},{id:3,term:"Kohlenhydrate",cat:"makro",short:"Der wichtigste schnelle Energielieferant des K\xF6rpers.",was:"Kohlenhydrate reichen von einfachem Zucker bis zu langkettiger St\xE4rke. Der K\xF6rper zerlegt sie zu Glukose, die als Energie dient. \u201EKomplexe\u201C Kohlenhydrate aus Vollkorn, H\xFClsenfr\xFCchten und Gem\xFCse werden langsam verdaut und halten den Blutzucker stabil; stark verarbeitete (Wei\xDFmehl, Zucker) lassen ihn schnell steigen und fallen.",warum:"Sie sind der bevorzugte Treibstoff f\xFCr Gehirn und Muskeln. Die Qualit\xE4t z\xE4hlt: ballaststoffreiche, wenig verarbeitete Kohlenhydrate s\xE4ttigen l\xE4nger und sind ges\xFCnder als schnelle Zucker.",quellen:"Vollkornprodukte, Haferflocken, Kartoffeln, Reis, H\xFClsenfr\xFCchte, Obst \u2013 und (weniger empfehlenswert) Wei\xDFmehl und Zucker.",bedarf:"DGE: \xFCber 50 % der t\xE4glichen Energie, \xFCberwiegend aus vollwertigen Quellen. Bei 2.000 kcal grob 250\u2013300 g/Tag.",link:{tag:"Low Carb"},pro:"Schnellste und effizienteste Energiequelle f\xFCr Gehirn und Muskeln. Vollwertige Varianten liefern Ballaststoffe und Vitamine.",con:"Stark verarbeitete Kohlenhydrate (Wei\xDFmehl, Zucker) lassen Blutzucker schnell steigen und fallen \u2013 f\xF6rdert Hei\xDFhunger. \xDCberschuss wird als Fett gespeichert."},{id:4,term:"Zucker",cat:"makro",short:"Einfaches Kohlenhydrat \u2013 schnelle Energie, aber nur in Ma\xDFen.",was:"Zucker umfasst Trauben-, Frucht- und Haushaltszucker. Man unterscheidet nat\xFCrlich enthaltenen Zucker (in Obst oder Milch) von \u201Efreiem\u201C/zugesetztem Zucker in S\xFC\xDFigkeiten, Softdrinks und vielen Fertigprodukten. Auf N\xE4hrwerttabellen steht er als \u201Edavon Zucker\u201C unter den Kohlenhydraten.",warum:"Zu viel freier Zucker liefert leere Kalorien, f\xF6rdert Karies und Blutzuckerspitzen und beg\xFCnstigt \xDCbergewicht. Nat\xFCrlicher Zucker aus ganzem Obst ist wegen der Ballaststoffe unproblematischer. Zuckerarme Lebensmittel tragen den Tag \u201EZuckerarm\u201C, gesunde Alternativen findest du in der Gruppe \u201ES\xFC\xDFungsmittel\u201C.",quellen:"S\xFC\xDFigkeiten, Softdrinks, S\xE4fte, Geb\xE4ck, viele Fertigprodukte; nat\xFCrlich in Obst und Milch.",bedarf:"WHO/DGE: freier Zucker m\xF6glichst unter 10 % der Energie \u2013 max. ~50 g/Tag bei 2.000 kcal, besser ~25 g.",link:{tag:"Zuckerarm"},pro:"Liefert schnell verf\xFCgbare Energie. Nat\xFCrlicher Zucker in Obst kommt mit Ballaststoffen und Vitaminen.",con:"Zugesetzter Zucker liefert leere Kalorien, f\xF6rdert Karies, Blutzuckerspitzen, Insulinresistenz und auf Dauer \xDCbergewicht. Kein essenzieller N\xE4hrstoff."},{id:5,term:"Ballaststoffe",cat:"makro",short:"Unverdauliche Pflanzenfasern \u2013 wichtig f\xFCr Darm und S\xE4ttigung.",was:"Ballaststoffe sind pflanzliche Bestandteile, die der D\xFCnndarm nicht verdaut. Sie quellen auf, machen satt und dienen den n\xFCtzlichen Darmbakterien als Nahrung. Man unterscheidet l\xF6sliche (Hafer, H\xFClsenfr\xFCchte) und unl\xF6sliche Fasern (Vollkorn, Gem\xFCse).",warum:"Sie f\xF6rdern eine gesunde Verdauung, halten lange satt, stabilisieren den Blutzucker und senken das Risiko f\xFCr Darm- und Herz-Kreislauf-Erkrankungen. Die meisten Menschen essen zu wenig davon. \u201EBallaststoffreich\u201C ist ein eigener Tag in der App.",quellen:"Vollkornprodukte, Haferflocken, H\xFClsenfr\xFCchte, N\xFCsse, Samen (Chia, Lein), Gem\xFCse und Obst.",bedarf:"DGE: mindestens 30 g/Tag.",link:{tag:"Ballaststoffreich"},pro:"Halten lange satt, stabilisieren Blutzucker, f\xF6rdern gesunde Darmflora, senken Cholesterin und Risiko f\xFCr Darmkrebs.",con:"Zu schnelle Steigerung kann Bl\xE4hungen und Bauchschmerzen verursachen. Auf ausreichend Fl\xFCssigkeit achten."},{id:6,term:"Fett",cat:"makro",short:"Energiereichster N\xE4hrstoff \u2013 und Tr\xE4ger fettl\xF6slicher Vitamine.",was:"Fett ist der energiereichste Makron\xE4hrstoff (~9 kcal/g). Es liefert essenzielle Fetts\xE4uren, die der K\xF6rper nicht selbst bilden kann, und erm\xF6glicht die Aufnahme der fettl\xF6slichen Vitamine A, D, E und K. Entscheidend ist die Art des Fetts.",warum:"Fett ist trotz vieler Kalorien unverzichtbar \u2013 f\xFCr Hormone, Zellw\xE4nde und Nervensystem. Unges\xE4ttigte Fette (Oliven\xF6l, N\xFCsse, Fisch) wirken g\xFCnstig, zu viel ges\xE4ttigtes und vor allem Transfett schadet dem Herz-Kreislauf-System. Fettarme Lebensmittel sind in der App getaggt.",quellen:"\xD6le, Butter, N\xFCsse, Samen, Avocado, fetter Fisch, K\xE4se.",bedarf:"DGE: ~30 % der Energie, \xFCberwiegend unges\xE4ttigt. Bei 2.000 kcal grob 65\u201380 g/Tag.",link:{tag:"Fettarm"},pro:"Tr\xE4ger fettl\xF6slicher Vitamine (A, D, E, K). Liefert essentielle Fetts\xE4uren. S\xE4ttigt gut. Wichtig f\xFCr Hormone und Zellmembranen.",con:"H\xF6chster Energiegehalt aller N\xE4hrstoffe (9 kcal/g) \u2013 bei \xDCberschuss schnell kalorienlastig. Zu viel ges\xE4ttigtes Fett ung\xFCnstig f\xFCr Herz-Kreislauf."},{id:7,term:"Ges\xE4ttigte & unges\xE4ttigte Fetts\xE4uren",cat:"makro",short:"Die \u201EQualit\xE4t\u201C des Fetts \u2013 unges\xE4ttigt gut, zu viel ges\xE4ttigt ung\xFCnstig.",was:"Ges\xE4ttigte Fetts\xE4uren (v. a. in tierischen Fetten, Butter, Kokosfett) sind meist bei Raumtemperatur fest. Unges\xE4ttigte Fetts\xE4uren (Pflanzen\xF6le, N\xFCsse, Fisch) sind fl\xFCssig und gelten als ges\xFCnder \u2013 dazu z\xE4hlen einfach unges\xE4ttigte (Oliven\xF6l) und mehrfach unges\xE4ttigte (Omega-3, Omega-6).",warum:"Ein hoher Anteil unges\xE4ttigter Fette wirkt g\xFCnstig auf Cholesterin und Herz. Zu viele ges\xE4ttigte Fetts\xE4uren k\xF6nnen das LDL-Cholesterin erh\xF6hen. Auf N\xE4hrwerttabellen steht \u201Edavon ges\xE4ttigt\u201C unter Fett.",quellen:"Unges\xE4ttigt: Oliven\xF6l, Raps\xF6l, N\xFCsse, Avocado, Lachs. Ges\xE4ttigt: Butter, Sahne, fettes Fleisch, Kokosfett.",bedarf:"DGE: ges\xE4ttigte Fetts\xE4uren m\xF6glichst unter 10 % der Energie (~20 g/Tag bei 2.000 kcal).",link:null,pro:"Unges\xE4ttigte Fette (Olive, N\xFCsse, Fisch) wirken entz\xFCndungshemmend und g\xFCnstig auf Cholesterin. Ges\xE4ttigte Fette sind stabil beim Erhitzen.",con:"Zu viele ges\xE4ttigte Fetts\xE4uren erh\xF6hen LDL-Cholesterin. Transfette (die ung\xFCnstigste Variante) sind praktisch ohne Nutzen und schaden dem Herz."},{id:8,term:"Omega-3-Fetts\xE4uren",cat:"makro",short:"Essenzielle mehrfach unges\xE4ttigte Fette \u2013 gut f\xFCr Herz und Gehirn.",was:"Omega-3-Fetts\xE4uren sind essenziell; der K\xF6rper kann sie nicht selbst herstellen. Wichtig sind die pflanzliche ALA (Lein, Walnuss, Chia) und die marinen EPA/DHA aus fettem Fisch, die der K\xF6rper direkt nutzen kann.",warum:"Omega-3 unterst\xFCtzt Herz-Kreislauf-System, Gehirn und Zellfunktionen und wirkt entz\xFCndungshemmend. Im Verh\xE4ltnis zu Omega-6 nehmen die meisten Menschen zu wenig Omega-3 auf. Entsprechende Lebensmittel tragen den Tag \u201EOmega-3\u201C.",quellen:"Fetter Seefisch (Lachs, Makrele, Hering, Sardinen), Leinsamen und Lein\xF6l, Waln\xFCsse, Chiasamen, Raps\xF6l.",bedarf:"DGE: ALA ~0,5 % der Energie; f\xFCr EPA/DHA gelten ~250 mg/Tag als Orientierung (etwa 1\u20132 Portionen Seefisch pro Woche).",link:{tag:"Omega-3"},pro:"Entz\xFCndungshemmend, gut f\xFCr Herz, Gehirn, Gelenke und Augen. K\xF6nnen Triglyceride senken.",con:"Pflanzliches ALA wird nur schlecht in die wirksamen EPA/DHA umgewandelt. Hochdosierte Pr\xE4parate k\xF6nnen Blutgerinnung beeinflussen."},{id:9,term:"Transfette",cat:"makro",short:"Industriell geh\xE4rtete Fette \u2013 m\xF6glichst ganz meiden.",was:"Transfetts\xE4uren entstehen vor allem bei der industriellen H\xE4rtung von Pflanzen\xF6len und beim starken Erhitzen/Frittieren. Sie stecken in manchen Backwaren, Frittiertem und billigen Margarinen.",warum:"Transfette gelten als die ung\xFCnstigsten Fette \xFCberhaupt: Sie erh\xF6hen das \u201Eschlechte\u201C LDL-Cholesterin, senken das \u201Egute\u201C HDL und steigern das Herz-Kreislauf-Risiko deutlich. Sie haben keinen gesundheitlichen Nutzen.",quellen:"Frittiertes, Fast Food, industrielles Geb\xE4ck, geh\xE4rtete Margarine, viele stark verarbeitete Snacks.",bedarf:"DGE/WHO: so wenig wie m\xF6glich, unter 1 % der Energie (~2 g/Tag).",link:null,pro:"Kein ern\xE4hrungsphysiologischer Vorteil \u2013 nur technologische Vorteile f\xFCr die Lebensmittelindustrie (l\xE4ngere Haltbarkeit, feste Konsistenz).",con:"Erh\xF6hen LDL, senken HDL, f\xF6rdern Entz\xFCndungen und Herzerkrankungen. Sollten so weit wie m\xF6glich gemieden werden."},{id:10,term:"Vitamin A",cat:"vitamin",short:"Wichtig f\xFCr Augen, Haut und Immunsystem.",was:"Vitamin A (Retinol) ist fettl\xF6slich. Der K\xF6rper bildet es auch aus Beta-Carotin, dem Farbstoff in orangem und dunkelgr\xFCnem Gem\xFCse.",warum:"Es ist zentral f\xFCr das Sehen (v. a. D\xE4mmerungssehen), gesunde Haut und Schleimh\xE4ute sowie die Immunabwehr.",quellen:"Leber, Eigelb, Butter, K\xE4se; als Beta-Carotin in Karotten, S\xFC\xDFkartoffeln, Spinat, Gr\xFCnkohl, Aprikosen.",bedarf:"DGE-Orientierung: ~0,7\u20130,9 mg Retinol-\xC4quivalent/Tag.",link:{tag:"Vitaminreich"},pro:"Sch\xFCtzt Augen (besonders Nachtsicht), Haut und Schleimh\xE4ute. St\xE4rkt Immunsystem. Beta-Carotin wirkt zus\xE4tzlich antioxidativ.",con:"Vitamin A (Retinol) kann in sehr hohen Mengen giftig sein (Hypervitaminose). Beta-Carotin aus Gem\xFCse ist sicher \u2013 der K\xF6rper reguliert die Umwandlung selbst."},{id:11,term:"Vitamin B1 (Thiamin)",cat:"vitamin",short:"F\xFCr Energiestoffwechsel und Nerven.",was:"Thiamin ist wasserl\xF6slich und an der Umwandlung von Kohlenhydraten in Energie beteiligt.",warum:"Wichtig f\xFCr Nervensystem, Herz und Muskulatur; ein Mangel zeigt sich zuerst \xFCber M\xFCdigkeit und Nervenbeschwerden.",quellen:"Vollkornprodukte, Haferflocken, H\xFClsenfr\xFCchte, Schweinefleisch, N\xFCsse.",bedarf:"DGE: ~1,0\u20131,3 mg/Tag.",link:{tag:"Vitaminreich"},pro:"Unverzichtbar f\xFCr Energiegewinnung aus Kohlenhydraten. Wichtig f\xFCr Nerven- und Herzfunktion.",con:"Wasserl\xF6slich \u2013 kein Risiko f\xFCr \xDCberdosierung \xFCber Nahrung. Hitzeempfindlich: beim Kochen gehen Mengen verloren."},{id:12,term:"Vitamin B2 (Riboflavin)",cat:"vitamin",short:"Energiestoffwechsel und Zellschutz.",was:"Riboflavin ist wasserl\xF6slich und Bestandteil von Enzymen, die Energie aus N\xE4hrstoffen gewinnen.",warum:"Unterst\xFCtzt Haut, Schleimh\xE4ute, Sehkraft und den Schutz der Zellen vor oxidativem Stress.",quellen:"Milchprodukte, Eier, Vollkorn, gr\xFCnes Gem\xFCse, N\xFCsse.",bedarf:"DGE: ~1,1\u20131,4 mg/Tag.",link:{tag:"Vitaminreich"},pro:"Sch\xFCtzt Zellen vor oxidativem Stress. Unterst\xFCtzt Haut, Schleimh\xE4ute und Sehkraft.",con:"Lichtempfindlich \u2013 Milch im Tetrapak beh\xE4lt mehr B2 als in Glasflaschen. Mangel ist in DE selten, aber bei sehr eingeschr\xE4nkter Ern\xE4hrung m\xF6glich."},{id:13,term:"Vitamin B6",cat:"vitamin",short:"Zentral f\xFCr Eiwei\xDFstoffwechsel und Nerven.",was:"Vitamin B6 (Pyridoxin) ist wasserl\xF6slich und an \xFCber 100 enzymatischen Reaktionen beteiligt, besonders im Aminos\xE4urestoffwechsel.",warum:"Wichtig f\xFCr Nervensystem, Bildung von Botenstoffen und roten Blutk\xF6rperchen sowie das Immunsystem.",quellen:"Fleisch, Fisch, Vollkorn, Kartoffeln, Bananen, H\xFClsenfr\xFCchte, N\xFCsse.",bedarf:"DGE: ~1,4\u20131,6 mg/Tag.",link:{tag:"Vitaminreich"},pro:"Zentral f\xFCr Eiwei\xDFstoffwechsel und Bildung von Neurotransmittern (u. a. Serotonin). Wichtig f\xFCr Immunsystem.",con:"Sehr hohe Supplement-Dosen (>100 mg/Tag \xFCber Monate) k\xF6nnen Nervensch\xE4den verursachen. \xDCber Nahrung kein Risiko."},{id:14,term:"Vitamin B12",cat:"vitamin",short:"F\xFCr Blutbildung und Nerven \u2013 kritisch bei veganer Ern\xE4hrung.",was:"B12 (Cobalamin) ist wasserl\xF6slich und kommt praktisch nur in tierischen Lebensmitteln vor. Der K\xF6rper kann es speichern.",warum:"Unverzichtbar f\xFCr die Bildung roter Blutk\xF6rperchen, die Nervenfunktion und den Zellstoffwechsel. Bei rein pflanzlicher Ern\xE4hrung ist eine Supplementierung n\xF6tig.",quellen:"Fleisch, Fisch, Eier, Milchprodukte; pflanzlich zuverl\xE4ssig nur \xFCber Nahrungserg\xE4nzung.",bedarf:"DGE: ~4,0 \xB5g/Tag.",link:{tag:"Vitaminreich"},pro:"F\xFCr Blutbildung und Nervenfunktion unverzichtbar. Sch\xFCtzt vor An\xE4mie und neurologischen Sch\xE4den. Der K\xF6rper kann es \xFCber Jahre speichern.",con:"Kommt fast nur in tierischen Lebensmitteln vor \u2013 bei veganer Ern\xE4hrung obligatorisch supplementieren. Mangel entwickelt sich schleichend und kann erst nach Jahren sichtbar werden."},{id:15,term:"Vitamin C",cat:"vitamin",short:"Immunsystem, Zellschutz und Eisenaufnahme.",was:"Vitamin C (Ascorbins\xE4ure) ist wasserl\xF6slich und ein starkes Antioxidans. Es ist hitzeempfindlich und geht beim Kochen teils verloren.",warum:"St\xE4rkt das Immunsystem, sch\xFCtzt Zellen, ist f\xFCr den Aufbau von Bindegewebe (Kollagen) n\xF6tig und verbessert die Aufnahme von pflanzlichem Eisen.",quellen:"Paprika, Zitrusfr\xFCchte, Beeren, Kiwi, Brokkoli, Kohl, Kartoffeln.",bedarf:"DGE: ~95\u2013110 mg/Tag.",link:{tag:"Vitaminreich"},pro:"Starkes Antioxidans. St\xE4rkt Immunsystem, unterst\xFCtzt Wundheilung und Kollagenbildung. Verbessert Eisenaufnahme.",con:"Sehr hohe Supplement-Dosen (>1 g/Tag) k\xF6nnen Durchfall und Nierensteine beg\xFCnstigen. \xDCber Nahrung kein Risiko."},{id:16,term:"Vitamin D",cat:"vitamin",short:"Das \u201ESonnenvitamin\u201C \u2013 f\xFCr Knochen und Immunsystem.",was:"Vitamin D ist fettl\xF6slich. Der K\xF6rper bildet es \xFCberwiegend selbst in der Haut unter Sonnenlicht; \xFCber die Nahrung wird nur ein kleiner Teil gedeckt.",warum:"Es steuert die Aufnahme von Calcium und ist damit zentral f\xFCr Knochen und Z\xE4hne; au\xDFerdem f\xFCr Muskeln und Immunsystem. In sonnenarmen Monaten ist ein Mangel in Mitteleuropa h\xE4ufig.",quellen:"Fetter Fisch (Lachs, Hering, Makrele), Eigelb, Pilze; Hauptquelle bleibt Sonnenlicht.",bedarf:"DGE: ~20 \xB5g (800 I.E.)/Tag bei fehlender k\xF6rpereigener Bildung.",link:{tag:"Vitaminreich"},pro:"Unverzichtbar f\xFCr Knochen, Muskeln und Immunsystem. Mangelausgleich kann Stimmung und Leistungsf\xE4higkeit verbessern.",con:"Fettl\xF6slich \u2013 \xDCberdosierung \xFCber Supplemente m\xF6glich und gef\xE4hrlich (Hyperkalz\xE4mie). Sonnenexposition ist die nat\xFCrlichste und sicherste Quelle."},{id:17,term:"Vitamin E",cat:"vitamin",short:"Fettl\xF6sliches Antioxidans \u2013 sch\xFCtzt die Zellen.",was:"Vitamin E (Tocopherol) ist fettl\xF6slich und sch\xFCtzt als Antioxidans die Fette in den Zellmembranen vor Sch\xE4digung.",warum:"Bewahrt Zellen vor oxidativem Stress und unterst\xFCtzt Immunsystem und Zellfunktion.",quellen:"Pflanzen\xF6le, N\xFCsse (v. a. Mandeln), Samen, Weizenkeime, Avocado.",bedarf:"DGE: ~11\u201315 mg/Tag.",link:{tag:"Vitaminreich"},pro:"Sch\xFCtzt Zellmembranen vor oxidativem Stress. Unterst\xFCtzt Immunsystem und Gef\xE4\xDFgesundheit.",con:"Sehr hohe Supplement-Dosen k\xF6nnen Blutgerinnung hemmen. \xDCber Nahrung kein Risiko."},{id:18,term:"Vitamin K",cat:"vitamin",short:"F\xFCr Blutgerinnung und Knochen.",was:"Vitamin K ist fettl\xF6slich und wird teils auch von Darmbakterien gebildet.",warum:"Notwendig f\xFCr die Blutgerinnung und den Knochenstoffwechsel.",quellen:"Gr\xFCnes Blattgem\xFCse (Spinat, Gr\xFCnkohl, Brokkoli), Kr\xE4uter, Pflanzen\xF6le.",bedarf:"DGE: ~60\u201380 \xB5g/Tag.",link:{tag:"Vitaminreich"},pro:"F\xFCr Blutgerinnung und Knochenstoffwechsel unverzichtbar. Wird auch von Darmbakterien gebildet.",con:"Interagiert mit Blutgerinnungshemmern (z. B. Marcumar) \u2013 Ern\xE4hrungs\xE4nderungen sollten bei Einnahme abgesprochen werden."},{id:19,term:"Fols\xE4ure (Folat)",cat:"vitamin",short:"F\xFCr Zellteilung und Blutbildung \u2013 besonders in der Schwangerschaft.",was:"Folat ist die nat\xFCrliche Form, Fols\xE4ure die synthetische in Pr\xE4paraten. Beide geh\xF6ren zu den B-Vitaminen und sind wasser- sowie hitzeempfindlich.",warum:"Wichtig f\xFCr Zellteilung, Blutbildung und die fr\xFChe Entwicklung des Ungeborenen. Frauen mit Kinderwunsch und Schwangere haben einen erh\xF6hten Bedarf.",quellen:"Gr\xFCnes Gem\xFCse, H\xFClsenfr\xFCchte, Vollkorn, Tomaten, Orangen, N\xFCsse.",bedarf:"DGE: ~300 \xB5g/Tag (Schwangere ~550 \xB5g).",link:{tag:"Vitaminreich"},pro:"Unverzichtbar f\xFCr Zellteilung und Blutbildung. Reduziert Neuralrohrdefekte in der Fr\xFChschwangerschaft erheblich.",con:"Hitzeempfindlich \u2013 beim Kochen gehen hohe Anteile verloren. Hohes Supplementieren kann Vitamin-B12-Mangel maskieren."},{id:20,term:"Calcium",cat:"mineral",short:"Baustein f\xFCr Knochen und Z\xE4hne.",was:"Calcium ist der mengenm\xE4\xDFig wichtigste Mineralstoff im K\xF6rper; der Gro\xDFteil steckt in Knochen und Z\xE4hnen.",warum:"Zentral f\xFCr stabile Knochen und Z\xE4hne, au\xDFerdem f\xFCr Muskeln, Nerven und Blutgerinnung. F\xFCr die Aufnahme wird Vitamin D ben\xF6tigt.",quellen:"Milchprodukte, Gr\xFCnkohl, Brokkoli, N\xFCsse, Sesam, calciumreiches Mineralwasser.",bedarf:"DGE: ~1.000 mg/Tag.",link:{tag:"Mineralstoffreich"},pro:"Baut Knochen und Z\xE4hne auf. Wichtig f\xFCr Muskeln, Nerven und Blutgerinnung. Ausreichende Versorgung sch\xFCtzt vor Osteoporose.",con:"Sehr hohe Supplementmengen k\xF6nnen Herzrisiko erh\xF6hen (laut neuerer Studien). \xDCber Nahrung kein Risiko. Hemmung durch zu viel Phytat und Oxalat (z. B. Spinat, Vollkorn)."},{id:21,term:"Eisen",cat:"mineral",short:"F\xFCr den Sauerstofftransport im Blut.",was:"Eisen ist Bestandteil des roten Blutfarbstoffs H\xE4moglobin. Tierisches (H\xE4m-)Eisen wird besser aufgenommen als pflanzliches; Vitamin C verbessert die Aufnahme.",warum:"Es transportiert Sauerstoff im Blut und ist f\xFCr Energie und Konzentration n\xF6tig. Mangel (v. a. bei Frauen) f\xFChrt zu M\xFCdigkeit und Bl\xE4sse.",quellen:"Fleisch, H\xFClsenfr\xFCchte, Vollkorn, K\xFCrbiskerne, gr\xFCnes Gem\xFCse; mit Vitamin-C-Quelle kombinieren.",bedarf:"DGE: Frauen ~15 mg, M\xE4nner ~10 mg/Tag.",link:{tag:"Mineralstoffreich"},pro:"F\xFCr Sauerstofftransport im Blut unverzichtbar. Wichtig f\xFCr Energie, Konzentration und Immunsystem.",con:"\xDCberschuss kann oxidativen Stress f\xF6rdern. Supplement nur bei nachgewiesenem Mangel. Kaffee, Tee und Calcium hemmen die Aufnahme."},{id:22,term:"Magnesium",cat:"mineral",short:"F\xFCr Muskeln, Nerven und Energiestoffwechsel.",was:"Magnesium ist an \xFCber 300 Enzymreaktionen beteiligt, besonders im Energiestoffwechsel.",warum:"Wichtig f\xFCr Muskel- und Nervenfunktion, Herzrhythmus und Knochen; ein Mangel \xE4u\xDFert sich u. a. in Muskelkr\xE4mpfen.",quellen:"Vollkorn, N\xFCsse, Samen, H\xFClsenfr\xFCchte, Bananen, dunkle Schokolade.",bedarf:"DGE: ~300\u2013400 mg/Tag.",link:{tag:"Mineralstoffreich"},pro:"Beteiligt an \xFCber 300 Enzymreaktionen. Reduziert Muskelkr\xE4mpfe, unterst\xFCtzt Schlaf und Stressresistenz.",con:"Sehr hohe Supplement-Dosen wirken abf\xFChrend. Mangel h\xE4ufiger als \xDCberschuss \u2013 besonders bei viel Sport, Stress oder Alkohol."},{id:23,term:"Kalium",cat:"mineral",short:"Reguliert Blutdruck und Fl\xFCssigkeitshaushalt.",was:"Kalium ist ein Mengenelement und der wichtigste Mineralstoff im Zellinneren \u2013 der Gegenspieler von Natrium.",warum:"Reguliert Blutdruck, Fl\xFCssigkeitshaushalt und die Weiterleitung von Nerven- und Muskelsignalen. Eine kaliumreiche, natriumarme Kost wirkt blutdrucksenkend.",quellen:"Kartoffeln, Bananen, H\xFClsenfr\xFCchte, Gem\xFCse, Trockenobst, N\xFCsse.",bedarf:"DGE: ~4.000 mg/Tag.",link:{tag:"Mineralstoffreich"},pro:"Reguliert Blutdruck und Herzrhythmus. Hohe Kaliumzufuhr \xFCber Nahrung wirkt blutdrucksenkend.",con:"Bei gesunden Nieren kein Risiko \xFCber Nahrung. Bei Nierenerkrankungen kann zu viel Kalium gef\xE4hrlich werden \u2013 dann \xE4rztliche R\xFCcksprache."},{id:24,term:"Zink",cat:"mineral",short:"F\xFCr Immunsystem, Haut und Wundheilung.",was:"Zink ist ein Spurenelement und Bestandteil zahlreicher Enzyme.",warum:"Wichtig f\xFCr Immunabwehr, Wundheilung, Haut und Haare sowie den Stoffwechsel.",quellen:"Fleisch, K\xE4se, Vollkorn, H\xFClsenfr\xFCchte, K\xFCrbiskerne, N\xFCsse.",bedarf:"DGE: M\xE4nner ~11\u201316 mg, Frauen ~7\u201310 mg/Tag.",link:{tag:"Mineralstoffreich"},pro:"St\xE4rkt Immunsystem, f\xF6rdert Wundheilung und ist wichtig f\xFCr Haut, Haare und Fruchtbarkeit.",con:"Hohe Supplement-Dosen hemmen Kupferaufnahme. Phytat in Vollkorn vermindert die Zinkaufnahme \u2013 Kombination mit Vitamin C oder Einweichen hilft."},{id:25,term:"Selen",cat:"mineral",short:"Spurenelement mit antioxidativer Wirkung.",was:"Selen ist ein Spurenelement und Teil von Enzymen, die Zellen vor oxidativem Stress sch\xFCtzen.",warum:"Unterst\xFCtzt Immunsystem und Schilddr\xFCse und sch\xFCtzt die Zellen; der Gehalt in Lebensmitteln h\xE4ngt stark vom Boden ab.",quellen:"Paran\xFCsse, Fisch, Fleisch, Eier, Vollkorn.",bedarf:"DGE: ~60\u201370 \xB5g/Tag.",link:{tag:"Mineralstoffreich"},pro:"Sch\xFCtzt Zellen als Teil antioxidativer Enzyme. Wichtig f\xFCr Schilddr\xFCse und Immunsystem.",con:"Geringe Spanne zwischen n\xFCtzlich und zu viel (toxische Dosis nicht weit entfernt). Paran\xFCsse: schon 2\u20133 St\xFCck t\xE4glich decken den Bedarf."},{id:26,term:"Jod",cat:"mineral",short:"Unverzichtbar f\xFCr die Schilddr\xFCse.",was:"Jod ist ein Spurenelement und Baustein der Schilddr\xFCsenhormone.",warum:"Die Schilddr\xFCsenhormone steuern den gesamten Stoffwechsel. In Deutschland sind B\xF6den jodarm, weshalb jodiertes Speisesalz und Seefisch wichtig sind.",quellen:"Seefisch, Meeresfr\xFCchte, jodiertes Speisesalz, Milchprodukte.",bedarf:"DGE: ~180\u2013200 \xB5g/Tag.",link:{tag:"Mineralstoffreich"},pro:"Unverzichtbar f\xFCr Schilddr\xFCsenhormone, die den gesamten Stoffwechsel steuern.",con:"Sowohl Mangel als auch \xDCberschuss k\xF6nnen die Schilddr\xFCse sch\xE4digen. In Deutschland h\xE4ufig unterversorgt \u2013 jodiertes Salz und Seefisch sind wichtig."},{id:27,term:"Natrium / Salz",cat:"mineral",short:"Wichtig in Ma\xDFen \u2013 zu viel erh\xF6ht den Blutdruck.",was:"Speisesalz besteht aus Natrium und Chlorid; Natrium ist der blutdruckrelevante Anteil. Auf N\xE4hrwerttabellen steht meist \u201ESalz\u201C (Natrium \xD7 2,5).",warum:"Natrium reguliert Fl\xFCssigkeitshaushalt und Nervenfunktion \u2013 der K\xF6rper braucht es. Die meisten essen jedoch deutlich zu viel Salz, was den Blutdruck erh\xF6ht. Der Gro\xDFteil steckt versteckt in verarbeiteten Lebensmitteln, nicht im Salzstreuer.",quellen:"Speisesalz, Wurst, K\xE4se, Brot, Fertiggerichte, salzige Snacks.",bedarf:"WHO/DGE: max. ~6 g Salz/Tag (WHO empfiehlt <5 g).",link:null,pro:"Reguliert Fl\xFCssigkeitshaushalt und Nervenfunktion. In normalen Mengen essenziell.",con:"Die meisten Menschen nehmen zu viel auf (v. a. aus verarbeiteten Lebensmitteln). Zu viel Salz erh\xF6ht Blutdruck und Herzrisiko."},{id:28,term:"Glutenfrei",cat:"begriff",short:"Ohne das Klebereiwei\xDF Gluten \u2013 Standard in dieser App.",was:"Gluten ist ein Klebereiwei\xDF in Weizen, Dinkel, Roggen und Gerste (Hafer oft durch Verunreinigung). Bei Z\xF6liakie oder Glutensensitivit\xE4t muss es gemieden werden. In dieser App wird ausschlie\xDFlich glutenfrei gegessen.",warum:"Glutenhaltige Lebensmittel (Brot, Nudeln, Wraps \u2026) m\xFCssen als glutenfreie Variante gew\xE4hlt werden \u2013 sie tragen das Badge \u201EGlutenfrei\u201C. Von Natur aus glutenfreie Lebensmittel wie Reis, Kartoffeln, Obst oder Fleisch brauchen keine Kennzeichnung.",quellen:"Von Natur aus glutenfrei: Reis, Mais, Kartoffeln, H\xFClsenfr\xFCchte, Quinoa, Obst, Gem\xFCse, Fleisch, Fisch, Eier.",bedarf:"",link:{badge:"gf"},pro:"Bei Z\xF6liakie oder Glutensensitivit\xE4t die einzige wirksame Behandlung. Bewusstes Lesen von Zutatenlisten f\xFChrt oft zu weniger verarbeiteten Lebensmitteln.",con:"Glutenfreie Ersatzprodukte sind oft teurer, kalorienreicher und n\xE4hrstoff\xE4rmer als die Originalprodukte. Kein Vorteil f\xFCr Menschen ohne Unvertr\xE4glichkeit."},{id:29,term:"Laktosefrei",cat:"begriff",short:"Ohne Milchzucker (Laktose) \u2013 Standard in dieser App.",was:"Laktose ist der nat\xFCrliche Zucker in Milch. Bei Laktoseintoleranz fehlt das Enzym Laktase, um sie zu verdauen. In dieser App werden Milchprodukte laktosefrei gew\xE4hlt.",warum:"Milchprodukte und milchhaltige Speisen tragen das Badge \u201ELaktosefrei\u201C und sollten als laktosefreie Variante gekauft werden. Eier sind \xFCbrigens keine Milchprodukte und von Natur aus laktosefrei.",quellen:"Von Natur aus laktosefrei: pflanzliche Drinks, Obst, Gem\xFCse, Fleisch, Fisch, Eier.",bedarf:"",link:{badge:"lf"},pro:"Beseitigt Verdauungsbeschwerden (Bl\xE4hungen, Kr\xE4mpfe, Durchfall) bei Laktoseintoleranz zuverl\xE4ssig.",con:"Laktosefreie Produkte sind teurer. Laktase-Tabletten als Alternative m\xF6glich. Nicht verwechseln mit Milcheiwei\xDFallergie \u2013 dort m\xFCssen alle Milchprodukte gemieden werden."},{id:30,term:"Vegan",cat:"begriff",short:"Ganz ohne tierische Produkte.",was:"Vegane Ern\xE4hrung verzichtet auf alle tierischen Lebensmittel \u2013 also auch auf Eier, Milch und Honig.",warum:"Rein pflanzliche Kost ist ballaststoff- und meist n\xE4hrstoffreich, erfordert aber bewusste Planung: Vitamin B12 muss erg\xE4nzt werden (auch Eisen, Zink, Jod und Omega-3 im Blick behalten).",quellen:"Gem\xFCse, Obst, H\xFClsenfr\xFCchte, Getreide, N\xFCsse, Samen, pflanzliche \xD6le.",bedarf:"",link:{tag:"Vegan"},pro:"Oft reich an Ballaststoffen, Vitaminen und sekund\xE4ren Pflanzenstoffen. G\xFCnstig f\xFCr Umwelt und Tierwohl.",con:"Vitamin B12 muss zwingend supplementiert werden. Eisen, Zink, Jod, Omega-3 und Calcium brauchen besondere Aufmerksamkeit. Eiwei\xDFqualit\xE4t durch Kombination sicherstellen."},{id:31,term:"Vegetarisch",cat:"begriff",short:"Ohne Fleisch und Fisch, mit Ei und Milch.",was:"Vegetarische Ern\xE4hrung verzichtet auf Fleisch und Fisch, erlaubt aber tierische Produkte wie Eier und Milchprodukte.",warum:"Gut umsetzbar und n\xE4hrstoffreich; auf ausreichend Eiwei\xDF (H\xFClsenfr\xFCchte, Milchprodukte, Eier) und Eisen achten.",quellen:"Pflanzliche Lebensmittel plus Eier und Milchprodukte.",bedarf:"",link:{tag:"Vegetarisch"},pro:"Ballaststoffreich, n\xE4hrstoffdicht. Eiwei\xDF- und Mikron\xE4hrstoffversorgung gut umsetzbar mit Eiern und Milchprodukten.",con:"Eisen (pflanzlich schlechter bioverf\xFCgbar) und Zink im Blick behalten. Bei vollst\xE4ndigem Verzicht auf Fisch: Omega-3 \xFCber Lein\xF6l und Waln\xFCsse oder Supplement."},{id:32,term:"Allergene",cat:"begriff",short:"Stoffe, die Allergien ausl\xF6sen k\xF6nnen \u2013 EU-kennzeichnungspflichtig.",was:"In der EU m\xFCssen 14 Hauptallergene angegeben werden, u. a. Gluten, Milch, Ei, Fisch, Krebstiere, Schalenfr\xFCchte (N\xFCsse), Erdn\xFCsse, Soja, Sesam, Sellerie und Senf. In dieser App siehst du je Lebensmittel die enthaltenen Allergene.",warum:"F\xFCr Betroffene k\xF6nnen schon kleine Mengen problematisch sein. Die Kennzeichnung hilft, riskante Zutaten zu erkennen \u2013 gerade bei verarbeiteten Produkten.",quellen:"H\xE4ufige Ausl\xF6ser: Gluten, Milch, Ei, N\xFCsse, Erdn\xFCsse, Soja, Fisch, Krebstiere, Sesam, Sellerie.",bedarf:"",link:null,pro:"Klare Kennzeichnungspflicht in der EU sch\xFCtzt Allergiker und erm\xF6glicht informierte Entscheidungen.",con:"Auch kleinste Spuren k\xF6nnen bei sensiblen Personen Reaktionen ausl\xF6sen. 'Kann Spuren enthalten'-Hinweise ernst nehmen."},{id:33,term:"Glyk\xE4mischer Index (GI)",cat:"begriff",short:"Wie schnell ein Lebensmittel den Blutzucker steigen l\xE4sst.",was:"Der glyk\xE4mische Index bewertet, wie stark und schnell kohlenhydrathaltige Lebensmittel den Blutzucker erh\xF6hen (Skala bis 100). Niedriger GI = langsamer, gleichm\xE4\xDFiger Anstieg.",warum:"Lebensmittel mit niedrigem GI (Vollkorn, H\xFClsenfr\xFCchte, Gem\xFCse) halten l\xE4nger satt und stabilisieren den Blutzucker; ein hoher GI (Wei\xDFmehl, Zucker) f\xFChrt zu schnellen Spitzen und Hei\xDFhunger. Ballaststoffe, Eiwei\xDF und Fett senken den GI einer Mahlzeit.",quellen:"Niedriger GI: H\xFClsenfr\xFCchte, Vollkorn, Gem\xFCse, N\xFCsse. Hoher GI: Wei\xDFbrot, Zucker, Cornflakes.",bedarf:"",link:null,pro:"Hilft, Lebensmittel nach ihrer Blutzuckerwirkung zu unterscheiden. Niedrig-GI-Kost f\xF6rdert stabilen Blutzucker und l\xE4nger anhaltende S\xE4ttigung.",con:"GI gilt immer nur f\xFCr isolierte Lebensmittel. In einer Mahlzeit mit Eiwei\xDF, Fett und Ballaststoffen sinkt der GI. Portionsgr\xF6\xDFe ist oft wichtiger als der GI-Wert allein."},{id:34,term:"Antioxidantien",cat:"begriff",short:"Zellsch\xFCtzer gegen \u201Efreie Radikale\u201C.",was:"Antioxidantien fangen aggressive Molek\xFCle (\u201Efreie Radikale\u201C) ab, die Zellen sch\xE4digen k\xF6nnen. Dazu z\xE4hlen u. a. Vitamin C und E, Beta-Carotin sowie sekund\xE4re Pflanzenstoffe wie Anthocyane in Beeren.",warum:"Sie sch\xFCtzen Zellen vor oxidativem Stress, der mit Alterung und verschiedenen Erkrankungen in Verbindung gebracht wird. Eine bunte, pflanzenreiche Ern\xE4hrung liefert das breiteste Spektrum.",quellen:"Beeren, buntes Gem\xFCse, N\xFCsse, gr\xFCner Tee, dunkle Schokolade, Kr\xE4uter und Gew\xFCrze.",bedarf:"",link:null,pro:"Sch\xFCtzen Zellen vor oxidativem Stress, der mit Alterung und chronischen Erkrankungen verbunden wird. Breites Spektrum durch bunte Ern\xE4hrung.",con:"Isolierte Antioxidantien in hohen Supplement-Dosen zeigen in Studien kaum Nutzen \u2013 manchmal sogar Nachteile. Nahrungsquellen sind weit \xFCberlegen."},{id:35,term:"Wasser",cat:"begriff",short:"Grundlage aller K\xF6rperfunktionen \u2013 ausreichend trinken.",was:"Wasser ist Hauptbestandteil des K\xF6rpers und an praktisch allen Prozessen beteiligt \u2013 von Transport \xFCber Temperaturregulation bis Verdauung.",warum:"Schon leichter Fl\xFCssigkeitsmangel mindert Konzentration und Leistung. Unges\xFC\xDFtes Wasser und Tee sind die besten Durstl\xF6scher \u2013 im Gegensatz zu zuckerhaltigen Getr\xE4nken.",quellen:"Wasser, Mineralwasser, unges\xFC\xDFte Tees; auch wasserreiches Obst und Gem\xFCse tragen bei.",bedarf:"DGE: ~1,5 l trinken pro Tag (mehr bei Hitze/Sport); insgesamt inkl. Nahrung ~2,5 l.",link:null,pro:"Absolut essenziell f\xFCr alle K\xF6rperfunktionen. Kalorienlos. Verbessert Konzentration und k\xF6rperliche Leistung. G\xFCnstig und \xFCberall verf\xFCgbar.",con:"Zu viel Wasser in sehr kurzer Zeit kann Elektrolythaushalt st\xF6ren (Hyponatri\xE4mie \u2013 selten, aber m\xF6glich bei Extrembelastung)."},{id:36,term:"Alkohol",cat:"begriff",short:"Genussmittel mit vielen leeren Kalorien.",was:"Alkohol liefert mit ~7 kcal/g fast so viel Energie wie Fett, aber keine n\xFCtzlichen N\xE4hrstoffe. Der K\xF6rper baut ihn bevorzugt ab, was den Fettabbau bremst.",warum:"Neben den leeren Kalorien belastet Alkohol Leber und Stoffwechsel und f\xF6rdert Hei\xDFhunger. Gesundheitlich gilt: je weniger, desto besser.",quellen:"Bier, Wein, Spirituosen, Cocktails, Lik\xF6re.",bedarf:"Kein Bedarf \u2013 es gibt keine \u201Egesunde\u201C Menge; m\xF6glichst wenig.",link:null,pro:"Kein ern\xE4hrungsphysiologischer Nutzen. Kultur- und Genusswert ist subjektiv.",con:"Leere Kalorien, lebertoxisch, hemmt Fettabbau und Muskelaufbau, st\xF6rt Schlaf, f\xF6rdert Hei\xDFhunger. Je weniger, desto besser \u2013 kein unbedenkliches Minimum."}],LEX_CATS=[{key:"makro",label:"Makron\xE4hrstoffe & Energie"},{key:"vitamin",label:"Vitamine"},{key:"mineral",label:"Mineralstoffe & Spurenelemente"},{key:"begriff",label:"Begriffe & Ern\xE4hrungsformen"}],lexCatLabel=t=>(LEX_CATS.find(o=>o.key===t)||{}).label||"";function LexSection({title:t,text:o}){return React.createElement("div",{className:"mt-4"},React.createEle  Gericht. Kaffee und schwarzer Tee hemmen die Eisenaufnahme dagegen \u2013 am besten mit etwas Abstand zur Mahlzeit trinken.",link:null},{id:2,title:"Fettl\xF6sliche Vitamine + etwas Fett",cat:"kombi",short:"Gem\xFCse mit einem Schuss \xD6l liefert mehr Vitamine.",text:"Die Vitamine A, D, E und K sind fettl\xF6slich \u2013 der K\xF6rper nimmt sie nur mit etwas Fett gut auf. Iss Karotten, Spinat, Gr\xFCnkohl oder Paprika deshalb mit einem Schuss Oliven\xF6l, ein paar N\xFCssen oder etwas Avocado. Ein Salat mit fettfreiem Dressing liefert deutlich weniger dieser Vitamine als einer mit hochwertigem \xD6l.",link:null},{id:3,title:"Kurkuma + schwarzer Pfeffer",cat:"kombi",short:"Eine Prise Pfeffer verst\xE4rkt die Wirkung von Kurkuma.",text:"Der wertvolle Inhaltsstoff Curcumin aus Kurkuma wird vom K\xF6rper nur schwer aufgenommen. Schwarzer Pfeffer enth\xE4lt Piperin, das die Aufnahme um ein Vielfaches erh\xF6ht. Eine Prise Pfeffer \u2013 und etwas Fett \u2013 in jedes Kurkuma-Gericht macht daher einen gro\xDFen Unterschied.",link:null},{id:4,title:"H\xFClsenfr\xFCchte + Getreide",cat:"kombi",short:"Ergibt vollst\xE4ndiges Eiwei\xDF aus rein pflanzlichen Quellen.",text:"Einzelne pflanzliche Eiwei\xDFquellen enthalten nicht alle essenziellen Aminos\xE4uren in idealer Menge. Kombinierst du H\xFClsenfr\xFCchte mit Getreide \u2013 Reis mit Bohnen, Linsen mit Vollkornbrot oder Hummus mit Fladenbrot \u2013 erg\xE4nzen sie sich zu einem vollwertigen Eiwei\xDF. Gerade bei veganer Ern\xE4hrung ein einfacher Trick f\xFCr die Proteinqualit\xE4t.",link:{tag:"Proteinreich"}},{id:5,title:"Joghurt + Haferflocken oder Banane",cat:"kombi",short:"Probiotika treffen auf Pr\xE4biotika \u2013 gut f\xFCr die Darmflora.",text:"Naturjoghurt, Skyr oder Quark liefern n\xFCtzliche Milchs\xE4urebakterien (Probiotika); Haferflocken und Bananen liefern Ballaststoffe, die diesen Bakterien als Futter dienen (Pr\xE4biotika). Zusammen unterst\xFCtzen sie eine gesunde Darmflora \u2013 ein ideales Fr\xFChst\xFCck, z. B. als Overnight Oats.",link:null},{id:6,title:"Tomaten erhitzt + \xD6l",cat:"kombi",short:"So wird das Antioxidans Lycopin besser verf\xFCgbar.",text:"Das Antioxidans Lycopin steckt in Tomaten, wird aber durch Erhitzen und in Kombination mit etwas \xD6l viel besser verf\xFCgbar. Eine Tomatensauce mit Oliven\xF6l liefert deshalb mehr Lycopin als rohe Tomaten \u2013 ein gutes Beispiel, dass \u201Everarbeitet\u201C nicht immer schlechter bedeutet.",link:null},{id:7,title:"Eiwei\xDF + Ballaststoffe zu jeder Mahlzeit",cat:"satt",short:"Die beste Kombi, um lange satt zu bleiben.",text:"Eiwei\xDF und Ballaststoffe s\xE4ttigen am st\xE4rksten und halten den Blutzucker stabil. Baue in jede Mahlzeit beides ein \u2013 Quark mit Beeren, Vollkornbrot mit Ei oder eine Bowl mit H\xE4hnchen, Gem\xFCse und H\xFClsenfr\xFCchten. So vermeidest du Hei\xDFhunger zwischen den Mahlzeiten.",link:{tag:"Proteinreich"}},{id:8,title:"Reihenfolge beim Essen",cat:"satt",short:"Erst Gem\xFCse & Eiwei\xDF, dann die Kohlenhydrate.",text:"Die Reihenfolge beeinflusst den Blutzucker: Wer zuerst Gem\xFCse und Eiwei\xDF isst und die Kohlenhydrate (Nudeln, Reis, Brot) danach, hat einen flacheren Blutzuckeranstieg als umgekehrt. Ein einfacher Trick ganz ohne Verzicht.",link:null},{id:9,title:"Vollkorn statt Wei\xDFmehl",cat:"satt",short:"Das wirkungsvollste einfache Upgrade.",text:"Vollkornvarianten von Brot, Nudeln und Reis enthalten mehr Ballaststoffe, Vitamine und Mineralstoffe und lassen den Blutzucker langsamer steigen. Der Wechsel von Wei\xDFmehl auf Vollkorn ist eine der wirkungsvollsten und einfachsten Umstellungen \u2013 in dieser App stehen die Vollkornvarianten auf \u201EOKAY\u201C, die Wei\xDFmehlprodukte auf \u201ETabu\u201C.",link:{tag:"Ballaststoffreich"}},{id:10,title:"Kalorien nicht trinken",cat:"satt",short:"Getr\xE4nke s\xE4ttigen kaum, liefern aber oft viel Zucker.",text:"Softdrinks, S\xE4fte und ges\xFC\xDFte Kaffeegetr\xE4nke liefern viel Zucker und Kalorien, machen aber kaum satt. Unges\xFC\xDFtes Wasser, Tee oder schwarzer Kaffee sind die beste Wahl. Wenn dir Wasser zu langweilig ist: mit Zitrone, Gurke, Minze oder Ingwer aufpeppen.",link:null},{id:11,title:"Zucker schrittweise reduzieren",cat:"reduzieren",short:"Der Gaumen gew\xF6hnt sich schneller um, als du denkst.",text:"Der Geschmackssinn passt sich an: Wer die Zuckermenge in Kaffee, M\xFCsli oder Joghurt schrittweise senkt, empfindet die Speisen nach kurzer Zeit als normal s\xFC\xDF. Gesunde S\xFC\xDFungsmittel wie Stevia, Erythrit oder M\xF6nchsfrucht k\xF6nnen den \xDCbergang erleichtern \u2013 in dieser App in der Gruppe \u201ES\xFC\xDFungsmittel\u201C.",link:null},{id:12,title:"Versteckten Zucker erkennen",cat:"reduzieren",short:"Ein Blick auf die Zutatenliste lohnt sich.",text:"Zugesetzter Zucker versteckt sich in vielen herzhaften Fertigprodukten \u2013 von Tomatensauce bis Wurst. Auf der Zutatenliste hat er viele Namen: Glukose-Fruktose-Sirup, Maltodextrin, Dextrose, Invertzucker. Faustregel: je weiter vorne in der Zutatenliste, desto mehr ist enthalten.",link:{tag:"Zuckerarm"}},{id:13,title:"Salz steckt im Verarbeiteten",cat:"reduzieren",short:"Nicht der Salzstreuer ist das eigentliche Problem.",text:"Der Gro\xDFteil des Salzes stammt nicht vom Nachsalzen, sondern aus verarbeiteten Lebensmitteln wie Brot, Wurst, K\xE4se und Fertiggerichten. Wer mehr frisch kocht, senkt die Salzzufuhr fast automatisch. Mit Kr\xE4utern und Gew\xFCrzen l\xE4sst sich Salz zudem gut ersetzen.",link:null},{id:14,title:"Vorkochen (Meal Prep)",cat:"praxis",short:"Gesund essen trotz wenig Zeit.",text:"Wer an einem Tag gr\xF6\xDFere Mengen kocht und portioniert, hat unter der Woche gesunde Mahlzeiten parat und greift seltener zu Fertigem oder Fast Food. Basis-Zutaten wie Reis, Quinoa, H\xFClsenfr\xFCchte, H\xE4hnchen und Ofengem\xFCse lassen sich gut vorbereiten und flexibel kombinieren.",link:null},{id:15,title:"Die halbe-Teller-Regel",cat:"praxis",short:"Ausgewogen essen ohne Kalorienz\xE4hlen.",text:"Eine einfache Orientierung: die H\xE4lfte des Tellers Gem\xFCse, ein Viertel Eiwei\xDF (Fleisch, Fisch, H\xFClsenfr\xFCchte, Quark), ein Viertel komplexe Kohlenhydrate (Vollkorn, Kartoffeln), dazu eine kleine Portion gesundes Fett. So ist die Mahlzeit meist automatisch ausgewogen.",link:null},{id:16,title:"Hei\xDFhunger vorbeugen",cat:"praxis",short:"Regelm\xE4\xDFig und s\xE4ttigend essen \u2013 und genug trinken.",text:"Hei\xDFhunger entsteht oft durch zu lange Essenspausen oder zu kohlenhydratlastige, eiwei\xDFarme Mahlzeiten. Regelm\xE4\xDFige, s\xE4ttigende Mahlzeiten mit genug Eiwei\xDF und Ballaststoffen beugen vor. Und: Manchmal ist vermeintlicher Hunger eigentlich Durst \u2013 erst ein Glas Wasser trinken.",link:null},{id:17,title:"Gesunde Snacks griffbereit",cat:"praxis",short:"Man isst, was in Reichweite ist.",text:"Wer N\xFCsse, Obst, Gem\xFCsesticks, Quark oder hartgekochte Eier griffbereit hat, greift seltener zu Chips und S\xFC\xDFigkeiten. In dieser App findest du passende Ideen in der Gruppe \u201ESnacks & S\xFC\xDFes\u201C auf \u201EErlaubt\u201C.",link:null},{id:18,title:"Bewusst und langsam essen",cat:"praxis",short:"Das S\xE4ttigungsgef\xFChl kommt mit Verz\xF6gerung.",text:"Das S\xE4ttigungsgef\xFChl setzt erst nach etwa 15\u201320 Minuten ein. Wer langsam isst, gut kaut und nebenbei nicht auf Bildschirme schaut, merkt fr\xFCher, wenn er satt ist \u2013 und isst automatisch weniger, ganz ohne bewussten Verzicht.",link:null}],TIPP_CATS=[{key:"kombi",label:"N\xE4hrstoff-Kombinationen"},{key:"satt",label:"S\xE4ttigung & Blutzucker"},{key:"reduzieren",label:"Weniger Zucker & Salz"},{key:"praxis",label:"Praktisches f\xFCr den Alltag"}];function TippsView({onMenu:t,onOpen:o,activeUser:i}){var V,s;const[k,v]=useState(()=>new Set),w=d=>v(g=>{const a=new Set(g);return a.has(d)?a.delete(d):a.add(d),a});return React.createElement("div",{className:"min-h-screen bg-slate-50 text-slate-800"},React.createElement("div",{className:"sticky top-0 z-10
